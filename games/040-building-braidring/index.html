    <style>
      body {
        margin: 0;

  <body>
    <canvas id="game"></canvas>
    <div>
      矢印/WASD: 移動 | E: 隣の台座の塔を1段積む | B/V: 梁を時計回り/反時計回りの隣へ架ける（高さ=低い方の塔。梁は歩兵を止め、両塔の自由長を数え直す） | 何も押さない: 待つ | R: 再開（終了後） | ?seed=N で条件が変わる
    </div>

  </body>
