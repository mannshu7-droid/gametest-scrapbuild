<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bastion (010)</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #ddd;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 12px;
      }
      canvas {
        image-rendering: pixelated;
        border: 1px solid #444;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div>
      WASD/矢印: 移動 | Space: 攻撃 | Shift: dash | E: スキル | 1〜4: ショップ購入（拠点滞在中）
      | B: 向いている方向にバリケード設置 | O: 前線拠点を建設 | R: リスタート（ゲームオーバー時）
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
