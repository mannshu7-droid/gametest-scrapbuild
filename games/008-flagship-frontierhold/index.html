<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontierhold (008)</title>
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: #111;
        color: #ddd;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px;
        box-sizing: border-box;
        overflow: hidden;
      }
      canvas {
        image-rendering: pixelated;
        border: 1px solid #444;
        /* 実解像度(canvas.width/height)は固定のまま、表示サイズだけをビューポートに
           収まるようアスペクト比を保って縮小する（iPad/Android等の画面幅差に対応）。
           タッチオーバーレイ(TouchInput)はcanvasを包むwrap要素の描画サイズに追従するため
           D-pad/ボタンの位置もこの縮小に自動で追従する */
        max-width: calc(100vw - 16px);
        max-height: calc(100vh - 40px);
        width: auto;
        height: auto;
      }
      .hint {
        font-size: 11px;
        text-align: center;
        padding: 0 8px;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div class="hint">WASD/矢印: 移動・採掘 | Space: 攻撃 | E: 範囲攻撃 | Q: 緊急離脱 | F: 支保工を設置 | G: 前線基地を建設 | ショップ中は 1〜9: 各カテゴリ購入 | R: リスタート</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
