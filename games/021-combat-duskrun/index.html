<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DuskRun (021)</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #ddd;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 12px;
      }
      canvas {
        image-rendering: pixelated;
        border: 1px solid #444;
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div>
      A/←: 退却 | D/→: 前進 | Space: 攻撃 | Shift: 直近方向へdash | F: 囮 | Z: ルート=direct / X: ルート=detour |
      拠点内(distance=0)で 1〜6: ショップ購入(atk/maxHp/maxDash/maxFlare/daylight/囮補充) | R: リスタート（ゲームオーバー時）
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
